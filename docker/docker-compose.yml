version: '3.8'
# 网络配置
networks:
  filling-network:
    driver: bridge

# 服务配置
services:
  # 后端服务
  filling-backend:
    image: filling/backend:v1.9.1
    container_name: filling-backend
    ports:
      - "17304:17304"
    volumes:
      - /opt/filling/conf:/opt/datains/conf
      - /opt/filling/logs:/opt/datains/logs
      - /opt/filling/plugins:/opt/datains/plugins
      - /opt/filling/data/kettle:/opt/datains/data/kettle
    shm_size: 1gb
    depends_on:
      filling-mysql:
        condition: service_healthy
    networks:
      - filling-network

  # 移动端服务
  filling-mobile:
    image: nginx:latest
    container_name: filling-mobile
    ports:
      - "17303:80"
    volumes:
      - /opt/filling/mobile/dist:/usr/share/nginx/html
      - /opt/filling/mobile/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      filling-backend:
        condition: service_healthy
    networks:
      - filling-network

  # MySQL数据库
  filling-mysql:
    image: mysql:5.7.36
    container_name: filling-mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u root",
          "-p 1QAZ@wsx_zhejin"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - /opt/filling/conf/mysql.env
    ports:
      - "3306:3306"
    volumes:
      - /opt/filling/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - /opt/filling/bin/mysql:/docker-entrypoint-initdb.d/
      - /opt/filling/data/mysql:/var/lib/mysql
    networks:
      - filling-network

  # Redis
  filling-redis:
    image: redis:latest
    container_name: filling-redis
    ports:
      - "6379:6379"
    volumes:
      - /opt/filling/data/redis:/data
    networks:
      - filling-network
    restart: always

  # MinIO
  filling-minio:
    image: minio/minio:latest
    container_name: filling-minio
    ports:
      - "9000:9000"  # API端口
      - "9001:9001"  # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - /opt/filling/data/minio:/data
    networks:
      - filling-network


